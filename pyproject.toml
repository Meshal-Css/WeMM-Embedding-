[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# app.py must silence warnings and extend sys.path before importing
# video_search, so module-level imports legitimately sit below other code.
# B008: `progress=gr.Progress()` in a default argument is the documented
# Gradio idiom, not a mutable-default bug.
"project/app.py" = ["E402", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
